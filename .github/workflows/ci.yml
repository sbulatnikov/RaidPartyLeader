# Тесты на заглушках API игры и сборка аддона — обычная и отладочная
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # те же проверки и сборка — перед выпуском (release.yml)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Инструменты сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Тесты, обычная и отладочная сборка скриптов
        run: sh test/run.sh
      - name: Сборка аддона
        run: python gen/assemble.py out/RaidPartyLeader
      - name: Отладочная сборка аддона
        run: ALLODS_DEBUG=1 python gen/assemble.py out/debug/RaidPartyLeader
      - name: В обычной сборке нет pcall и отладки
        run: |
          ! grep -rnE '(^|[^[:alnum:]_.])pcall\b' out/RaidPartyLeader/Scripts --include='*.lua'
          ! grep -rnwE 'debug|DEBUG|Debug|Probe' out/RaidPartyLeader/Scripts --include='*.lua'
          test ! -e out/RaidPartyLeader/Scripts/Probe.lua
      - name: Упаковка
        run: python gen/pak.py out/RaidPartyLeader out/RaidPartyLeader.pak
      - uses: actions/upload-artifact@v4
        with:
          name: RaidPartyLeader-pak
          path: out/RaidPartyLeader.pak
