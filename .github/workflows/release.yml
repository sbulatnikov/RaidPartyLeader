# Выпуск на GitHub по тегу версии: проверки и сборка (ci.yml), затем выпуск с RaidPartyLeader.pak.
# Запуск вручную с тегом — проба: если выпуск с таким тегом уже есть, ничего не публикуется.
# Шаги выпуска общие для всех аддонов: https://github.com/sbulatnikov/allods-addon-ci
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Тег версии, например v0.11.5
        required: true

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    permissions:
      contents: write
    uses: sbulatnikov/allods-addon-ci/.github/workflows/release.yml@v1
    with:
      tag: ${{ inputs.tag || github.ref_name }}
